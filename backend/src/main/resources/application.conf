# Knutpunkt Application Configuration
# This file contains default configuration values.
# Override values using:
#   1. External config file: -Dconfig.file=/path/to/application.conf
#   2. Environment variables: ${?ENV_VAR_NAME}
#   3. System properties: -Dproperty.name=value

# Ktor Server Configuration
ktor {
    deployment {
        port = 8080
        port = ${?PORT}  # Override with PORT env var
        host = "0.0.0.0"
        host = ${?HOST}  # Override with HOST env var
        watch = []
    }
    
    application {
        modules = [com.ninjacontrol.knutpunkt.ApplicationKt.module]
    }
}

# Application Configuration
knutpunkt {
    # Tasks storage
    tasks {
        directory = "./tasks"
        directory = ${?TASKS_DIRECTORY}  # Override with env var
        enableCache = true
        enableCache = ${?ENABLE_CACHE}
    }
    
    # CORS Configuration
    cors {
        allowedHosts = [
            "localhost:5173",
            "127.0.0.1:5173"
        ]
        allowCredentials = true
    }
    
    # Logging levels (also configurable via env vars in logback.xml)
    logging {
        level = "INFO"
        level = ${?LOG_LEVEL}
        appLevel = "DEBUG"
        appLevel = ${?APP_LOG_LEVEL}
        ktorLevel = "INFO"
        ktorLevel = ${?KTOR_LOG_LEVEL}
    }
}
