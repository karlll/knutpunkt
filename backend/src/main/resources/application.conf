# Knutpunkt Application Configuration
# This file contains default configuration values.
# Override values using:
#   1. Command-line arguments (see --help)
#   2. External config file: --config=/path/to/application.conf
#   3. Logging levels can also be set via environment variables (LOG_LEVEL, APP_LOG_LEVEL, KTOR_LOG_LEVEL)

# Ktor Server Configuration
ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
        watch = []
    }

    application {
        modules = [com.ninjacontrol.knutpunkt.ApplicationKt.module]
    }
}

# Application Configuration
knutpunkt {
    # Application title
    title = "Knutpunkt"

    # Tasks storage
    tasks {
        directory = "./tasks"
        enableCache = true
    }

    # CORS Configuration
    cors {
        allowedHosts = [
            "127.0.0.1:5173"
        ]
        allowCredentials = true
    }

    # Terminal Configuration
    terminal {
        enabled = false
        idleTimeoutMinutes = 30
        outputBufferSize = 100
    }

    # Logging levels (configurable via env vars in logback.xml)
    logging {
        level = "INFO"
        level = ${?LOG_LEVEL}
        appLevel = "DEBUG"
        appLevel = ${?APP_LOG_LEVEL}
        ktorLevel = "INFO"
        ktorLevel = ${?KTOR_LOG_LEVEL}
    }

    # SSE Configuration
    sse {
        keepaliveIntervalSeconds = 15
    }
}
